name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a run on main: it may be pushing images
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: annakonn200059/job-tracker-ci/.github/workflows/node.yml@v1.0.0
    with:
      # renovate: datasource=node-version depName=node
      node-version: "24"
  api-types:
    name: API types up to date
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run gen:api --workspace=apps/web

      - run: git diff --exit-code apps/web/api/schema.gen.ts
  image:
    needs: [ci, api-types]
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        app: [web, landing]
    uses: annakonn200059/job-tracker-ci/.github/workflows/image.yml@v1.0.0
    with:
      image-name: job-tracker-${{ matrix.app }}
      dockerfile: apps/${{ matrix.app }}/Dockerfile
